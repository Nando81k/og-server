name = "og-server-bot"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# The promotion pass. Once a day is plenty — nobody's seventh day is urgent.
[triggers]
crons = ["0 9 * * *"]

# Set with `wrangler secret put`, never in this file:
#   DISCORD_TOKEN, DISCORD_PUBLIC_KEY
[vars]
GUILD_ID = ""
MEMBER_AFTER_DAYS = "7"

# database_id comes from running `wrangler d1 create og-pickem` (not run here —
# needs Cloudflare credentials this task doesn't have). Once created, apply the
# schema with `wrangler d1 execute og-pickem --remote --file=./schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "og-pickem"
database_id = "REPLACE_ME"
