name = "og-server-bot"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# Daily, not weekly. scheduled() runs the New Member -> Member promotion
# pass AND the pick'em job (score last week, post the leaderboard, sync the
# next week's schedule) on every invocation, and both are safe to run every
# day: promotions only act on members actually due, and runWeekly's own
# openWeek check means an incomplete week returns early and an ESPN failure
# is a no-op, so the leaderboard still posts exactly once, as soon as the
# week actually finishes — because openWeek advances to the next week right
# after this run scores and syncs it, so tomorrow's run finds nothing left
# to score. A weekly-only trigger would instead let a promotion wait up to
# 13 days for "a week", and would idle the leaderboard post until the next
# Tuesday even when the week finished days earlier.
[triggers]
#
# The second trigger drives only the ESPN fantasy feed (runFantasyFeed), which
# is the one job here that is better live than daily: a trade posted the next
# morning is stale. scheduled() tells the two apart by event.cron, so the
# string must match FANTASY_CRON in src/index.mjs exactly. Until
# FANTASY_LEAGUE_ID is set it returns immediately and costs nothing.
crons = ["0 9 * * *", "*/10 * * * *"]

# Keep the logs. Without this, console.log and console.error exist only in the
# moment — readable by `wrangler tail` and by nobody else, ever. The cron runs
# unattended at 5am Eastern, which is precisely when no one is tailing, so a
# failed promotion pass or a pick'em run that threw would leave behind a failed
# invocation and no way to find out why. One run a day plus a handful of slash
# commands is nowhere near any sampling limit, so keep every event.
[observability]
enabled = true
head_sampling_rate = 1

# Secrets live in Cloudflare, never in this file. PICKS_SECRET is already set.
# Still to set, both from the Discord Developer Portal:
#   wrangler secret put DISCORD_TOKEN        (Bot tab -> Reset Token)
#   wrangler secret put DISCORD_PUBLIC_KEY   (General Information)
[vars]
GUILD_ID = "1546707076460445787"
MEMBER_AFTER_DAYS = "7"
SEASON = "2026"
# Right-click #season-leaderboard in Discord -> Copy Channel ID.
LEADERBOARD_CHANNEL_ID = "1546736665492717600"
# Where the one-off "the pick'em is live" post goes when week 1 is first scored.
PICKEM_CHANNEL_ID = "1546736667992391761"

# ESPN fantasy basketball. Leave FANTASY_LEAGUE_ID empty to keep the whole
# feature off. The league id is the number after leagueId= in your ESPN league
# URL. A season is named for the year it ENDS in, so 2026-27 is "2027".
FANTASY_LEAGUE_ID = "2021901076"
FANTASY_SEASON = "2027"
# Where adds, drops and trades are posted: right-click #standings -> Copy
# Channel ID. It must be a text channel, not one of the forum channels, and
# not #trade-court, which is the server's own vote on proposed trades.
FANTASY_CHANNEL_ID = "1546736683226234952"
# Trade proposals. TRADE_CHANNEL_ID is where cards are posted: right-click
# #trade-court -> Copy Channel ID. Left empty, a card is posted in whatever
# channel /trade propose was run in. TRADE_VOTE_HOURS is how long the vote runs.
TRADE_CHANNEL_ID = ""
TRADE_VOTE_HOURS = "24"
# Private league? Also set (never in this file):
#   wrangler secret put ESPN_S2
#   wrangler secret put ESPN_SWID

# Created with `wrangler d1 create og-pickem`; schema applied with
# `wrangler d1 execute og-pickem --remote --file=./schema.sql`. Both done.
[[d1_databases]]
binding = "DB"
database_name = "og-pickem"
database_id = "78df46c3-59bb-4491-9135-035d24586ff0"
