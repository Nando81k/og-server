name = "og-server-bot"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# Daily, not weekly. scheduled() runs the New Member -> Member promotion
# pass AND the pick'em job (score last week, post the leaderboard, sync the
# next week's schedule) on every invocation, and both are safe to run every
# day: promotions only act on members actually due, and runWeekly's own
# openWeek check means an incomplete week returns early and an ESPN failure
# is a no-op, so the leaderboard still posts exactly once, as soon as the
# week actually finishes — because openWeek advances to the next week right
# after this run scores and syncs it, so tomorrow's run finds nothing left
# to score. A weekly-only trigger would instead let a promotion wait up to
# 13 days for "a week", and would idle the leaderboard post until the next
# Tuesday even when the week finished days earlier.
[triggers]
crons = ["0 9 * * *"]

# Set with `wrangler secret put` — this task writes configuration only, it
# does not provision infrastructure, so these are NOT run here. A human must
# run each of these once, out of band:
#   wrangler secret put DISCORD_TOKEN
#   wrangler secret put DISCORD_PUBLIC_KEY
#   wrangler secret put PICKS_SECRET
# For PICKS_SECRET, use a long random value, e.g. `openssl rand -hex 32`.
# Never put a secret value in this file.
[vars]
GUILD_ID = ""
MEMBER_AFTER_DAYS = "7"
SEASON = "2026"
# Right-click #season-leaderboard in Discord -> Copy Channel ID.
LEADERBOARD_CHANNEL_ID = ""

# database_id comes from running `wrangler d1 create og-pickem` (not run here —
# needs Cloudflare credentials this task doesn't have). Once created, apply the
# schema with `wrangler d1 execute og-pickem --remote --file=./schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "og-pickem"
database_id = "REPLACE_ME"
